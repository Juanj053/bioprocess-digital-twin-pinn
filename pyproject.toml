[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioprocess-digital-twin-pinn"
version = "0.1.0"
description = "Physics-Informed Neural Network (PINN) bioprocess digital twin and gray-box soft sensor for 20 L aerobic stirred-tank fermentation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Juan José Álvarez Morales", email = "jjalvarezm77@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "plotly>=5.14.0",
    "streamlit>=1.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
pinn-bioprocess = "pinn_bioprocess.cli:main"

[project.urls]
Homepage = "https://github.com/Juanj053/bioprocess-digital-twin-pinn"
Repository = "https://github.com/Juanj053/bioprocess-digital-twin-pinn.git"
"LinkedIn Author" = "https://www.linkedin.com/in/juanj-alva"
"Elevate Biotech" = "https://github.com/Juanj053"

[tool.hatch.build.targets.wheel]
packages = ["src/pinn_bioprocess"]
